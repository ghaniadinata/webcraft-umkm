<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">WebCraft UMKM: ide ke website terukur</title>
<desc id="desc">Infografik peta masalah, solusi, perjalanan pelanggan, model bisnis, rasio utama, dan roadmap 12 minggu.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient><style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eff6ff}.muted{fill:#a8b6cf}.card{fill:#111c31;stroke:#334766;stroke-width:1.5}.accent{fill:#38bdf8}.green{fill:#34d399}.gold{fill:#fbbf24}.heading{font-size:32px;font-weight:700}.sub{font-size:16px}.h{font-size:20px;font-weight:700}.b{font-size:15px}.small{font-size:13px}
</style></defs>
<rect width="1400" height="900" rx="28" fill="url(#bg)"/>
<text x="60" y="72" class="heading">WEBCRAFT UMKM</text><text x="60" y="105" class="sub muted">Website yang jelas dipilih, transparan dikerjakan, dan terukur setelah go-live</text>
<rect x="60" y="145" width="400" height="180" rx="18" class="card"/><text x="88" y="182" class="h gold">MASALAH YANG DITANGANI</text><text x="88" y="219" class="b">• Paket dan biaya sulit dibandingkan</text><text x="88" y="249" class="b">• Brief/aset terkumpul lambat</text><text x="88" y="279" class="b">• Revisi dan progres kurang jelas</text>
<rect x="500" y="145" width="400" height="180" rx="18" class="card"/><text x="528" y="182" class="h accent">SOLUSI PRODUK</text><text x="528" y="219" class="b">• Kalkulator + rekomendasi beralasan</text><text x="528" y="249" class="b">• Brief terpandu + invoice bertahap</text><text x="528" y="279" class="b">• Portal milestone + revisi berkuota</text>
<rect x="940" y="145" width="400" height="180" rx="18" class="card"/><text x="968" y="182" class="h green">NILAI UNTUK UMKM</text><text x="968" y="219" class="b">• Tahu pilihan dan biaya sebelum order</text><text x="968" y="249" class="b">• Hubungkan website ke kanal yang dipakai</text><text x="968" y="279" class="b">• Progres dan serah-terima terdokumentasi</text>
<text x="60" y="380" class="h">JOURNEY PELANGGAN</text>
<g class="b"><rect x="60" y="400" width="230" height="90" rx="14" class="card"/><text x="83" y="435">1  Temukan</text><text x="83" y="462" class="small muted">Konten / referral / Google</text><rect x="310" y="400" width="230" height="90" rx="14" class="card"/><text x="333" y="435">2  Pilih</text><text x="333" y="462" class="small muted">Wizard + kalkulator</text><rect x="560" y="400" width="230" height="90" rx="14" class="card"/><text x="583" y="435">3  Brief &amp; DP</text><text x="583" y="462" class="small muted">Scope dan invoice jelas</text><rect x="810" y="400" width="230" height="90" rx="14" class="card"/><text x="833" y="435">4  Review</text><text x="833" y="462" class="small muted">Milestone + revisi</text><rect x="1060" y="400" width="280" height="90" rx="14" class="card"/><text x="1083" y="435">5  Go-live</text><text x="1083" y="462" class="small muted">Handover + pemeliharaan</text></g>
<rect x="60" y="530" width="620" height="270" rx="18" class="card"/><text x="88" y="570" class="h gold">RASIO PILOT (HIPOTESIS)</text><text x="88" y="610" class="b">Lead berkualitas / pengunjung unik</text><text x="600" y="610" text-anchor="end" class="b accent">8%</text><text x="88" y="647" class="b">Order DP / proposal terkirim</text><text x="600" y="647" text-anchor="end" class="b accent">25%</text><text x="88" y="684" class="b">Brief lengkap ≤24 jam / order DP</text><text x="600" y="684" text-anchor="end" class="b green">70%</text><text x="88" y="721" class="b">Pembayaran tepat waktu / invoice jatuh tempo</text><text x="600" y="721" text-anchor="end" class="b green">90%</text><text x="88" y="765" class="small muted">Ukur baseline dan laporkan n; target bukan benchmark pasar.</text>
<rect x="720" y="530" width="620" height="270" rx="18" class="card"/><text x="748" y="570" class="h accent">ROADMAP 12 MINGGU</text><text x="748" y="610" class="b">01-03  Discovery, paket, prototype</text><text x="748" y="647" class="b">04-06  Laravel/Docker, katalog, brief</text><text x="748" y="684" class="b">07-09  Order, milestone, revisi</text><text x="748" y="721" class="b">10-12  QA, pilot, evaluasi, deploy</text><text x="748" y="765" class="small muted">Gate: validasi dulu; gateway &amp; vault setelah aman dan perlu.</text>
<text x="60" y="850" class="small muted">Rujukan rancangan: PRD/SRS pengguna (14 Okt 2026); BI QRIS Semester I 2025. Laravel 13 + Docker Desktop/WSL2.</text>
</svg>
